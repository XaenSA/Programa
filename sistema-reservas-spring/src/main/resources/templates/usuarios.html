<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { padding: 10px 15px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; }
        .btn-danger { background-color: #dc3545; }
    </style>
</head>
<body>

    <h2>Gestión de Usuarios (Spring Boot)</h2>
    
    <a th:href="@{/usuarios/nuevo}" class="btn">Registrar Nuevo Usuario</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${listaUsuarios}">
                <td th:text="${user.idUsuario}"></td>
                <td th:text="${user.nombre}"></td>
                <td th:text="${user.correo}"></td>
                <td th:text="${user.rol}"></td>
                <td>
                
                    <a th:href="@{/usuarios/eliminar/{id}(id=${user.idUsuario})}" class="btn btn-danger">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
