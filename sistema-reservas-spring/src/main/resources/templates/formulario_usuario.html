<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Usuario</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold;}
        input[type="text"], input[type="email"] { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px;}
        .btn-back { background-color: #6c757d; text-decoration: none; display: inline-block; margin-left: 10px;}
    </style>
</head>
<body>

    <h2>Nuevo Usuario</h2>

    <form th:action="@{/usuarios}" th:object="${usuario}" method="post">
        
        <div class="form-group">
            <label>Nombre Completo:</label>
            <input type="text" th:field="*{nombre}" required />
        </div>

        <div class="form-group">
            <label>Correo Electrónico:</label>
            <input type="email" th:field="*{correo}" required />
        </div>

        <div class="form-group">
            <label>Rol en el Sistema:</label>
            <input type="text" th:field="*{rol}" placeholder="Ej: Administrador, Cliente..." required />
        </div>

        <button type="submit" class="btn">Guardar Usuario</button>
        <a th:href="@{/usuarios}" class="btn btn-back">Volver a la lista</a>
    </form>

</body>
</html>
